<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <title>Metronome Playlist</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">

    <link rel="icon" type="image/png" href="assets/icon-192.png">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div>
                <h1>🎵 Metronome Playlist</h1>
                <p class="subtitle">
                    Тренировки, упражнения и разогрев в одном плейлисте
                </p>
            </div>

            <!-- <div class="header-actions">
                <button id="exportBtn" class="secondary">
                    Export
                </button>

                <label class="secondary file-btn">
                    Import
                    <input type="file" id="importFile" accept=".json" hidden>
                </label>
            </div> -->
        </header>

        <section class="now-playing card">

            <div class="np-left">

                <div class="bpm-circle">
                    <svg viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="52" class="bg-ring">
                        </circle>

                        <circle cx="60" cy="60" r="52" class="progress-ring" id="currentProgressRing">
                        </circle>
                    </svg>

                    <div class="circle-content">
                        <span id="currentBpm">--</span>
                        <small>BPM</small>
                    </div>
                </div>

            </div>

            <div class="np-center">

                <div class="stats-grid">

                    <div class="stat">
                        <span>Элемент</span>
                        <strong id="currentIndex">
                            -
                        </strong>
                    </div>

                    <div class="stat">
                        <span>Повтор</span>
                        <strong id="currentRepeat">
                            -
                        </strong>
                    </div>

                    <div class="stat">
                        <span>Осталось</span>
                        <strong id="timeLeft">
                            -
                        </strong>
                    </div>

                    <div class="stat">
                        <span>Деление</span>
                        <strong id="currentSubdivision">
                            -
                        </strong>
                    </div>

                </div>

                <div class="beat-display" id="beatDisplay">
                    -
                </div>

                <div class="playlist-progress">
                    <div class="playlist-progress-bar" id="playlistProgressBar">
                    </div>
                </div>

                <div class="playlist-progress-text" id="playlistProgressText">
                    0%
                </div>

            </div>

        </section>

        <section class="controls card">

            <button id="startBtn" class="primary">
                ▶ Start
            </button>

            <button id="pauseBtn" class="secondary">
                ⏸ Pause
            </button>

            <button id="stopBtn" class="danger">
                ⏹ Stop
            </button>

            <button id="addItemBtn" class="success">
                ＋ Add
            </button>

        </section>

        <section class="summary card">

            <div>
                <span>Общая длительность</span>
                <strong id="totalDuration">
                    00:00
                </strong>
            </div>

            <div>
                <span>Количество этапов</span>
                <strong id="totalItems">
                    0
                </strong>
            </div>

        </section>

        <section class="presets card">

            <div class="preset-buttons">

                <button data-preset="warmup">
                    Warmup
                </button>

                <button data-preset="speed">
                    Speed Builder
                </button>

                <button data-preset="practice">
                    Practice
                </button>

            </div>

        </section>

        <section class="playlist card">

            <div class="section-title">
                Playlist
            </div>

            <div id="playlistContainer" class="playlist-container">
            </div>

        </section>



    </div>

    <template id="playlistItemTemplate">

        <div class="playlist-item">

            <div class="drag-handle">
                ☰
            </div>

            <input class="bpm-input" type="number" min="20" max="400">

            <input class="duration-input" type="number" min="1">

            <input class="repeat-input" type="number" min="1">

            <select class="subdivision-select">

                <option value="quarter">
                    Quarter
                </option>

                <option value="eighth">
                    Eighth
                </option>

                <option value="triplet">
                    Triplet
                </option>

                <option value="sixteenth">
                    Sixteenth
                </option>

            </select>

            <button class="delete-btn">
                ✕
            </button>

        </div>

    </template>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('./service-worker.js');
            });
        }
    </script>

</body>

</html>
